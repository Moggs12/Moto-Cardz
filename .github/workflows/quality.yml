name: Full-deck quality checks
on:
  push:
    branches: [main, 'build/**']
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'assets/**', 'icon*.png', 'apple-touch-icon.png', 'scripts/**', 'tests/**', 'playwright.config.cjs', 'package*.json', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-review
          path: |
            playwright-report/
            qa/browser-results/
          retention-days: 14

  release-checkpoint:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [gameplay-and-assets, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v9
        with:
          script: |
            const checkpoint = require('./scripts/release-checkpoint.cjs');
            await checkpoint({github, context, core});
