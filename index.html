<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moto Cardz">
<title>Moto Cardz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0b0c0f;--panel:#15171c;--panel2:#1d2027;--text:#f7f7f2;--muted:#9ca0aa;--accent:#c8ff3d;--danger:#ff5c72;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 20% 0%,#25212f 0,#0b0c0f 38%),#0b0c0f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:900;letter-spacing:-.04em;font-size:26px}.brand span{color:var(--accent)}
.hud{display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,255,255,.07);border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800;color:#ddd}
.screen{display:none}.screen.active{display:block}

/* home */
.hero{min-height:72vh;display:grid;place-items:center;text-align:center}
.hero-inner{max-width:680px;width:100%}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(48px,10vw,96px);line-height:.88;letter-spacing:-.075em;margin:12px 0 20px}
.hero p.lede{font-size:18px;color:var(--muted);margin:0 auto 26px;max-width:540px}
.setting{margin:18px auto 0;max-width:620px;text-align:left}
.setting-title{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.opts{display:grid;gap:8px}
.opts.c2{grid-template-columns:repeat(2,1fr)}.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;text-align:left;cursor:pointer}
.opt strong{display:block;font-size:14px}
.opt small{display:block;color:var(--muted);margin-top:3px;font-size:11px;line-height:1.35}
.opt.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:rgba(200,255,61,.08)}
.mode-note{max-width:620px;margin:14px auto 0;text-align:left;color:var(--muted);font-size:13px;line-height:1.5}

.btn{border:0;border-radius:16px;padding:14px 20px;font-weight:900;cursor:pointer;transition:.18s transform,.18s opacity;background:var(--accent);color:#111}
.btn:hover{transform:translateY(-1px)}
.btn.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}

/* game chrome */
.game-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px;gap:12px}
.round{font-size:12px;color:var(--muted);font-weight:800}
.score{font-size:24px;font-weight:900}
.pips{display:flex;gap:6px;margin:0 0 12px;min-height:12px}
.pip{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12)}
.pip.w{background:var(--accent)}.pip.l{background:var(--danger)}.pip.d{background:#c9ccd4}
.notice{margin:0 0 12px;color:var(--muted);font-size:13px;min-height:1.4em}

/* cards */
.card{border-radius:24px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.35);position:relative}
.card-head{padding:14px 16px;background:var(--c1);color:var(--c2)}
.card-type{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.card-name{font-size:26px;line-height:1;letter-spacing:-.04em;font-weight:950;margin-top:6px}
.card-body{padding:16px}
.bike-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px}
.stats{display:grid;gap:8px}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 13px;border-radius:12px;background:#20232a;border:1px solid rgba(255,255,255,.05)}
.stat .lab{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .label{font-size:11px;font-weight:900;color:#bfc3cb}
.stat .spec{font-size:12px;color:var(--muted);white-space:nowrap}
.stat .value{font-size:24px;font-weight:950;line-height:1}
.stat.act{cursor:pointer}
.stat.act:hover{border-color:rgba(200,255,61,.5)}
.stat.sel{background:rgba(200,255,61,.14);border-color:var(--accent)}
.stat.target{border-color:var(--accent);border-style:dashed}
.stat.dim{opacity:.4}
.stat.hit{background:rgba(255,255,255,.1);border-color:#fff}
.card.won{box-shadow:0 0 0 2px var(--accent),0 18px 50px rgba(0,0,0,.35)}
.card.won .stat.hit{background:rgba(200,255,61,.16);border-color:var(--accent)}
.card.lost{box-shadow:0 0 0 2px var(--danger),0 18px 50px rgba(0,0,0,.35)}
.card.lost .stat.hit{background:rgba(255,92,114,.16);border-color:var(--danger)}
.card.mini{border-radius:16px}
.mini .card-head{padding:10px 12px}
.mini .card-type{font-size:9px}
.mini .card-name{font-size:16px;margin-top:4px}
.mini .card-body{padding:10px}
.mini .bike-meta{font-size:11px;margin-bottom:8px}
.mini .stats{gap:6px}
.mini .stat{padding:7px 9px;border-radius:9px}
.mini .stat .label{font-size:10px}
.mini .stat .spec{font-size:11px}
.mini .stat .value{font-size:18px}
.back{min-height:100%;height:100%;display:grid;place-items:center;align-content:center;gap:14px;padding:24px;background:linear-gradient(135deg,#20232b,#0f1014);text-align:center}
.back .mark{font-size:28px;font-weight:1000;transform:rotate(-8deg);line-height:1.05}
.back .held{font-size:12px;color:var(--muted);font-weight:700}
.mini .back{padding:14px;min-height:120px}
.mini .back .mark{font-size:20px}
.badge{font-size:12px;font-weight:800;color:#111;background:var(--accent);padding:6px 10px;border-radius:999px}
.flip-in{animation:flip .32s ease-out}
@keyframes flip{from{transform:perspective(700px) rotateY(80deg);opacity:.2}to{transform:perspective(700px) rotateY(0);opacity:1}}

/* quick match */
.battle{display:grid;grid-template-columns:1fr 80px 1fr;gap:14px;align-items:center}
.player .stat.act:hover{border-color:rgba(200,255,61,.5)}
.vs{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-weight:1000;font-size:15px;margin:auto;box-shadow:0 10px 35px rgba(255,255,255,.12)}

/* duel */
.foe-hand{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:12px;font-weight:700}
.foe-cards{display:flex;gap:5px}
.foe-card{width:22px;height:30px;border-radius:5px;background:linear-gradient(135deg,#2a2e38,#14161b);border:1px solid var(--line)}
.arena{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:stretch;margin:0 auto 14px;max-width:560px}
.arena .vs{width:40px;height:40px;font-size:12px;align-self:center}
.slot-empty{min-height:120px;border:1.5px dashed rgba(255,255,255,.18);border-radius:16px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.section-title{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
.hand{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 2px 14px;margin:0 -2px}
.hand .card{flex:0 0 206px;scroll-snap-align:start;transition:transform .15s}
.hand .card.selected{transform:translateY(-6px);box-shadow:0 0 0 2px var(--accent),0 18px 40px rgba(0,0,0,.4)}
.hand .card.defendable{cursor:pointer}
.confirm{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-top:6px;border-radius:16px;background:#22252d;border:1px solid var(--accent);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:5}
.confirm p{margin:0;font-size:14px;font-weight:700}
.confirm .actions{margin:0}

/* results + overlay */
.result{margin-top:16px;margin-bottom:14px;border-radius:18px;padding:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:none}
.result.show{display:block}
.result.win{border-color:rgba(200,255,61,.4)}.result.lose{border-color:rgba(255,92,114,.4)}.result.draw{border-color:rgba(255,255,255,.25)}
.result-title{font-size:22px;font-weight:950}
.result-copy{color:var(--muted);margin-top:4px;font-size:13px;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.overlay{position:fixed;inset:0;background:rgba(6,7,9,.78);display:grid;place-items:center;padding:20px;z-index:20}
.end-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.end-card h2{margin:0 0 6px;font-size:32px;letter-spacing:-.04em;line-height:1}
.end-card .big{font-size:56px;font-weight:950;letter-spacing:-.05em;margin:10px 0 2px}
.end-card p{color:var(--muted);font-size:14px;margin:6px 0 0;line-height:1.5}
.end-card .actions{justify-content:center;margin-top:20px}
.end-card.win h2{color:var(--accent)}.end-card.lose h2{color:var(--danger)}

@media(min-width:900px){.hand{overflow:visible;flex-wrap:nowrap}.hand .card{flex:1 1 0;min-width:0}}
@media(max-width:760px){
  .app{padding:14px 10px 26px}
  .battle{grid-template-columns:1fr;gap:10px}
  .vs{width:48px;height:48px}
  .ai{order:3}.player{order:1}.battle .vs{order:2}
  .card-name{font-size:23px}
  .opts.c3.levels{grid-template-columns:1fr}
  .game-top{margin-bottom:10px}
  .arena .vs{width:34px;height:34px;font-size:11px}
  .arena{grid-template-columns:1fr 34px 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app">
<header><div class="brand">MOTO <span>CARDZ</span></div><div class="hud"><div class="pill" id="aiPill">AI: Easy</div><div class="pill" id="countPill"></div></div></header>

<section id="home" class="screen active"><div class="hero"><div class="hero-inner">
  <div class="eyebrow">Full data V2</div>
  <h1>Pick a stat.<br>Take the win.</h1>
  <p class="lede" id="lede"></p>
  <div class="setting"><div class="setting-title">Mode</div>
    <div class="opts c2" id="modeOpts">
      <button class="opt" data-v="quick"><strong>Quick match</strong><small>One card each. You choose the stat.</small></button>
      <button class="opt" data-v="duel"><strong>Duel</strong><small>Hold five cards. Attack and defend.</small></button>
    </div></div>
  <div class="setting"><div class="setting-title">AI level</div>
    <div class="opts c3 levels" id="levelOpts">
      <button class="opt" data-v="easy"><strong>Easy</strong><small></small></button>
      <button class="opt" data-v="medium"><strong>Medium</strong><small></small></button>
      <button class="opt" data-v="hard"><strong>Hard</strong><small></small></button>
    </div></div>
  <div class="setting" id="targetSetting"><div class="setting-title">First to</div>
    <div class="opts c3" id="targetOpts">
      <button class="opt" data-v="3"><strong>3 wins</strong><small>Short</small></button>
      <button class="opt" data-v="5"><strong>5 wins</strong><small>Standard</small></button>
      <button class="opt" data-v="7"><strong>7 wins</strong><small>Long</small></button>
    </div></div>
  <p class="mode-note" id="modeNote"></p>
  <div style="margin-top:18px"><button class="btn" id="start">Start game</button></div>
</div></div></section>

<section id="quick" class="screen">
  <div class="game-top"><div><div class="round" id="qRound"></div><div class="score" id="qScore"></div></div><button class="btn secondary" data-menu>Menu</button></div>
  <div class="pips" id="qPips"></div>
  <p class="notice" id="qPrompt"></p>
  <div class="battle"><article class="card player" id="qPlayer"></article><div class="vs">VS</div><article class="card ai" id="qAi"></article></div>
  <div class="result" id="qResult"><div class="result-title" id="qResultTitle"></div><div class="result-copy" id="qResultCopy"></div><div class="actions"><button class="btn" id="qNext">Next round</button></div></div>
</section>

<section id="duel" class="screen">
  <div class="game-top"><div><div class="round" id="dRound"></div><div class="score" id="dScore"></div></div><button class="btn secondary" data-menu>Menu</button></div>
  <div class="pips" id="dPips"></div>
  <div class="foe-hand"><span id="foeLabel"></span><div class="foe-cards" id="foeCards"></div></div>
  <p class="notice" id="dPrompt"></p>
  <div class="arena"><div id="dYou"></div><div class="vs">VS</div><div id="dFoe"></div></div>
  <div class="result" id="dResult"><div class="result-title" id="dResultTitle"></div><div class="result-copy" id="dResultCopy"></div><div class="actions"><button class="btn" id="dNext">Next round</button></div></div>
  <h2 class="section-title" id="handTitle">Your hand</h2>
  <div class="hand" id="dHand"></div>
  <div class="confirm" id="dConfirm" hidden><p id="dConfirmText"></p><div class="actions"><button class="btn secondary" id="dCancel">Change</button><button class="btn" id="dGo">Play card</button></div></div>
</section>
</div>

<div class="overlay" id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
  <div class="end-card" id="endCard"><h2 id="endTitle"></h2><div class="big" id="endScore"></div><p id="endCopy"></p>
    <div class="actions"><button class="btn secondary" id="endMenu">Menu</button><button class="btn" id="rematch">Play again</button></div></div>
</div>

// <ENGINE>
const STATS=['topSpeed','power','engine','economy','value'];
const STAT_META={
  topSpeed:{label:'TOP SPEED',name:'top speed'},
  power:{label:'POWER',name:'power'},
  engine:{label:'ENGINE',name:'engine size'},
  economy:{label:'ECONOMY',name:'economy'},
  value:{label:'VALUE',name:'value'}
};
let RNG=Math.random;
const pickRandom=a=>a[Math.floor(RNG()*a.length)];
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function spec(b,k){
  if(k==='topSpeed')return b.topSpeed+' mph';
  if(k==='power')return b.power+' bhp';
  if(k==='engine')return b.engineCC.toLocaleString('en-GB')+' cc';
  if(k==='economy')return b.mpg+' mpg';
  return '£'+Math.round(b.price).toLocaleString('en-GB');
}
const DIST={};STATS.forEach(k=>DIST[k]=BIKES.map(b=>b.stats[k]).sort((x,y)=>x-y));
function pct(k,v,from=0){
  const a=DIST[k],start=Math.floor(a.length*from);let lt=0,eq=0;
  for(let i=start;i<a.length;i++){if(a[i]<v)lt++;else if(a[i]===v)eq++}
  return (lt+eq/2)/(a.length-start);
}
BIKES.forEach(b=>{b.flex=STATS.reduce((s,k)=>s+pct(k,b.stats[k]),0)/STATS.length});
const sign=(a,b,k)=>Math.sign(a.stats[k]-b.stats[k]);

/* Quick Match: the AI holds a small hand and, once you name a stat, plays its best card for it */
const AI_HAND={easy:1,medium:2,hard:3};
function dealAiHand(pool,level){return shuffle(pool).slice(0,AI_HAND[level])}
function aiPickForStat(hand,stat){
  const top=Math.max(...hand.map(b=>b.stats[stat]));
  return pickRandom(hand.filter(b=>b.stats[stat]===top));
}

/* Duel: AI decisions */
const TUNE={atk:{spec:0.35,exp:2},def:{spec:0.35,from:0.5}};
function aiChooseAttack(hand,level){
  const opts=[];
  hand.forEach((b,i)=>STATS.forEach(k=>opts.push({i,k,p:pct(k,b.stats[k]),flex:b.flex})));
  if(level==='easy')return pickRandom(opts);
  if(level==='medium'){
    opts.sort((x,y)=>y.p-x.p);
    return pickRandom(opts.slice(0,Math.max(3,Math.ceil(opts.length*0.2))));
  }
  let best=null,bs=-9;
  for(const o of opts){
    const s=Math.pow(o.p,TUNE.atk.exp)-TUNE.atk.spec*o.flex+RNG()*0.02;
    if(s>bs){bs=s;best=o}
  }
  return best;
}
function aiChooseDefense(hand,stat,level){
  if(level==='easy')return Math.floor(RNG()*hand.length);
  const byValue=hand.map((b,i)=>i).sort((x,y)=>hand[y].stats[stat]-hand[x].stats[stat]);
  if(level==='medium')return RNG()<0.65?byValue[0]:Math.floor(RNG()*hand.length);
  let best=0,bs=-9;
  hand.forEach((b,i)=>{
    const s=pct(stat,b.stats[stat],TUNE.def.from)-TUNE.def.spec*b.flex+RNG()*0.02;
    if(s>bs){bs=s;best=i}
  });
  return best;
}
// </ENGINE>


/* ---------- shared UI ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>Number.isInteger(v)?v:v.toFixed(1);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const later=(fn,ms)=>setTimeout(fn,ms);
const LEVEL_COPY={
  quick:{easy:'Holds 1 card',medium:'Holds 2 cards and plays the better one',hard:'Holds 3 cards and plays the best one'},
  duel:{easy:'Plays cards at random',medium:'Attacks and defends with strong cards',hard:'Plans which cards to spend'}
};
const S={mode:'quick',level:'easy',target:5};
try{Object.assign(S,JSON.parse(localStorage.getItem('motocardz.settings')||'{}'))}catch(e){}
if(!['quick','duel'].includes(S.mode))S.mode='quick';
if(!['easy','medium','hard'].includes(S.level))S.level='easy';
if(![3,5,7].includes(+S.target))S.target=5;S.target=+S.target;
const save=()=>{try{localStorage.setItem('motocardz.settings',JSON.stringify(S))}catch(e){}};

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function pips(el,results,slots){
  const out=results.map(r=>`<span class="pip ${r}" title="${{w:'Won',l:'Lost',d:'Draw'}[r]}"></span>`);
  while(out.length<slots)out.push('<span class="pip"></span>');
  el.innerHTML=out.join('');el.setAttribute('aria-label','Round results');
}
function cardHTML(b,o={}){
  const tag=o.act?'button':'div';
  const rows=STATS.map(k=>{
    const cls=['stat'];
    if(o.act)cls.push('act');
    if(o.hit===k)cls.push('hit');
    if(o.sel===k)cls.push('sel');
    if(o.target){cls.push(o.target===k?'target':'dim')}
    return `<${tag} class="${cls.join(' ')}" data-stat="${k}"${o.act?' type="button"':''}><span class="lab"><span class="label">${STAT_META[k].label}</span><span class="spec">${esc(spec(b,k))}</span></span><span class="value">${fmt(b.stats[k])}</span></${tag}>`;
  }).join('');
  return `<div class="card-head" style="--c1:${b.primary};--c2:${b.secondary}"><div class="card-type">${esc(b.type)}</div><div class="card-name">${esc(b.make)}<br>${esc(b.model)}</div></div><div class="card-body"><div class="bike-meta"><span>${esc(cap(b.engineType))}</span><span>${esc(b.id)}</span></div><div class="stats">${rows}</div></div>`;
}
function settle(a,b,stat){const r=sign(a,b,stat);return r>0?'win':r<0?'lose':'draw'}
function outcomeCopy(pb,ab,stat){
  return `${pb.make} ${pb.model} scored ${fmt(pb.stats[stat])} (${spec(pb,stat)}) against the AI's ${ab.make} ${ab.model} on ${fmt(ab.stats[stat])} (${spec(ab,stat)}) for ${STAT_META[stat].name}.`;
}
function showEnd(o){
  $('endCard').className='end-card '+o.tone;
  $('endTitle').textContent=o.title;$('endScore').textContent=o.score;$('endCopy').textContent=o.copy;
  $('end').hidden=false;$('rematch').focus();
}

/* ---------- Quick match ---------- */
let Q=null;
function qStart(){
  Q={score:{p:0,a:0},results:[],round:0,used:new Set(),locked:false,over:false,player:null,hand:[],ai:null};
  show('quick');qNext();
}
function qNext(){
  Q.round++;Q.locked=false;Q.ai=null;
  let avail=BIKES.filter(b=>!Q.used.has(b.id));
  if(avail.length<8){Q.used.clear();avail=BIKES.slice()}
  Q.player=pickRandom(avail);
  Q.hand=dealAiHand(avail.filter(b=>b!==Q.player),S.level);
  Q.used.add(Q.player.id);Q.hand.forEach(b=>Q.used.add(b.id));
  $('qResult').className='result';
  $('qRound').textContent=`Round ${Q.round} · first to ${S.target}`;
  $('qScore').textContent=`You ${Q.score.p} – ${Q.score.a} AI`;
  $('qPrompt').textContent='Choose one stat from your card.';
  pips($('qPips'),Q.results,0);
  $('qPlayer').className='card player';
  $('qPlayer').innerHTML=cardHTML(Q.player,{act:true});
  const n=Q.hand.length;
  $('qAi').className='card ai';
  $('qAi').innerHTML=`<div class="back" style="min-height:330px"><div class="mark">MOTO<br>CARDZ</div><div class="held">AI holds ${n} card${n>1?'s':''}</div></div>`;
}
function qPlay(stat){
  if(!Q||Q.locked)return;Q.locked=true;
  Q.ai=aiPickForStat(Q.hand,stat);
  const out=settle(Q.player,Q.ai,stat);
  if(out==='win'){Q.score.p++}else if(out==='lose'){Q.score.a++}
  Q.results.push(out==='win'?'w':out==='lose'?'l':'d');
  Q.over=Q.score.p>=S.target||Q.score.a>=S.target;
  $('qPlayer').className='card player '+(out==='win'?'won':out==='lose'?'lost':'');
  $('qPlayer').innerHTML=cardHTML(Q.player,{hit:stat});
  $('qAi').className='card ai flip-in '+(out==='lose'?'won':out==='win'?'lost':'');
  $('qAi').innerHTML=cardHTML(Q.ai,{hit:stat});
  $('qScore').textContent=`You ${Q.score.p} – ${Q.score.a} AI`;
  pips($('qPips'),Q.results,0);
  $('qPrompt').textContent=`You chose ${STAT_META[stat].name}.`+(Q.hand.length>1?` The AI played the best of its ${Q.hand.length} cards.`:'');
  const r=$('qResult');r.className='result show '+out;
  $('qResultTitle').textContent=out==='win'?'Round won':out==='lose'?'Round lost':'Draw';
  $('qResultCopy').textContent=outcomeCopy(Q.player,Q.ai,stat);
  $('qNext').textContent=Q.over?'See result':'Next round';
  $('qNext').focus({preventScroll:true});
}
function qEnd(){
  const won=Q.score.p>Q.score.a;
  showEnd({tone:won?'win':'lose',title:won?'You win the match':'The AI wins the match',score:`${Q.score.p} – ${Q.score.a}`,
    copy:`Quick match, first to ${S.target}, AI on ${cap(S.level)}. ${Q.results.length} rounds played.`});
}
$('qPlayer').addEventListener('click',e=>{const s=e.target.closest('.stat');if(s)qPlay(s.dataset.stat)});
$('qNext').onclick=()=>{if(Q.over)qEnd();else qNext()};

/* ---------- Duel ---------- */
let D=null,SID=0;
const HAND=5,WIN_AT=3;
function dStart(){
  const deck=shuffle(BIKES);
  D={sid:++SID,hands:{p:deck.slice(0,HAND),a:deck.slice(HAND,HAND*2)},reserve:deck.slice(HAND*2),score:{p:0,a:0},results:[],round:0,
     attacker:RNG()<.5?'p':'a',phase:'',sel:null,pCard:null,aCard:null,stat:null,sudden:false,over:false,outcome:null};
  show('duel');dNextRound();
}
function dLater(fn,ms){const sid=D.sid;later(()=>{if(D&&D.sid===sid)fn()},ms)}
function dNextRound(){
  D.round++;D.pCard=D.aCard=D.stat=D.sel=D.outcome=null;
  if(D.attacker==='p'){D.phase='pAttack';dRender()}
  else{D.phase='aChoose';dRender();dLater(dAiAttack,900)}
}
function dAiAttack(){
  const o=aiChooseAttack(D.hands.a,S.level);
  D.aCard=D.hands.a.splice(o.i,1)[0];D.stat=o.k;D.phase='pDefend';dRender();
  if(D.hands.p.length===1){D.sel={i:0};dLater(dConfirm,1200)}
}
function dConfirm(){
  if(!D||!D.sel)return;
  if(D.phase==='pAttack'){
    if(!D.sel.k)return;
    D.pCard=D.hands.p.splice(D.sel.i,1)[0];D.stat=D.sel.k;D.sel=null;D.phase='aDefend';dRender();
    dLater(()=>{const j=aiChooseDefense(D.hands.a,D.stat,S.level);D.aCard=D.hands.a.splice(j,1)[0];dResolve()},1000);
  }else if(D.phase==='pDefend'){
    D.pCard=D.hands.p.splice(D.sel.i,1)[0];D.sel=null;D.phase='aDefend';dRender();
    dLater(dResolve,600);
  }
}
function dResolve(){
  D.phase='reveal';
  const out=settle(D.pCard,D.aCard,D.stat);D.outcome=out;
  if(out==='win')D.score.p++;else if(out==='lose')D.score.a++;
  D.results.push(out==='win'?'w':out==='lose'?'l':'d');
  D.over=D.score.p>=WIN_AT||D.score.a>=WIN_AT||(!D.sudden&&D.round>=HAND&&D.score.p!==D.score.a)||(D.sudden&&out!=='draw');
  dRender();
}
function dContinue(){
  if(D.over)return dEnd();
  D.attacker=D.attacker==='p'?'a':'p';
  if(!D.sudden&&D.round>=HAND)D.sudden=true;
  if(D.sudden){D.hands.p=[D.reserve.pop()];D.hands.a=[D.reserve.pop()]}
  dNextRound();
}
function dEnd(){
  const won=D.score.p>D.score.a;
  showEnd({tone:won?'win':'lose',title:won?'You win the duel':'The AI wins the duel',score:`${D.score.p} – ${D.score.a}`,
    copy:`Duel, AI on ${cap(S.level)}. `+(D.sudden?'Decided in sudden death.':`Decided over ${D.results.length} rounds.`)});
}
function dPrompt(){
  const l=STAT_META[D.stat]?STAT_META[D.stat].label:'';
  switch(D.phase){
    case 'pAttack':return D.hands.p.length===1?'Your attack. Tap a stat on your last card.':'Your attack. Pick a card, then choose the stat to fight on.';
    case 'aChoose':return 'The AI is choosing a card and a stat…';
    case 'pDefend':return D.hands.p.length===1?`The AI attacks on ${l}. You have one card left, so it plays automatically.`:`The AI attacks on ${l}. Pick a card to defend.`;
    case 'aDefend':return D.attacker==='p'?'The AI is choosing a defender…':'Revealing…';
    case 'reveal':return `Contested stat: ${STAT_META[D.stat].name}.`;
  }
  return '';
}
function dRender(){
  const label=D.sudden?'Sudden death':`Round ${D.round} of ${HAND}`;
  $('dRound').textContent=`${label} · ${D.attacker==='p'?'You attack':'AI attacks'}`;
  $('dScore').textContent=`You ${D.score.p} – ${D.score.a} AI`;
  pips($('dPips'),D.results,D.sudden?D.results.length:HAND);
  $('foeLabel').textContent=`AI hand: ${D.hands.a.length} card${D.hands.a.length===1?'':'s'}`;
  $('foeCards').innerHTML=D.hands.a.map(()=>'<span class="foe-card"></span>').join('');
  $('dPrompt').textContent=dPrompt();

  // arena
  const rev=D.phase==='reveal';
  const pv=rev?(D.outcome==='win'?'won':D.outcome==='lose'?'lost':''):'';
  const av=rev?(D.outcome==='lose'?'won':D.outcome==='win'?'lost':''):'';
  $('dYou').innerHTML=D.pCard?`<article class="card mini ${pv}">${cardHTML(D.pCard,{hit:rev?D.stat:null})}</article>`:'<div class="slot-empty">Your card</div>';
  if(rev){$('dFoe').innerHTML=`<article class="card mini flip-in ${av}">${cardHTML(D.aCard,{hit:D.stat})}</article>`}
  else if(D.aCard||D.phase==='aDefend'||D.phase==='aChoose'){
    const tag=D.phase==='aChoose'?'Choosing…':D.attacker==='a'?`Attacking on ${STAT_META[D.stat].label}`:`Defending on ${STAT_META[D.stat].label}`;
    $('dFoe').innerHTML=`<article class="card mini"><div class="back"><div class="mark">MOTO<br>CARDZ</div><div class="badge">${tag}</div></div></article>`;
  }else $('dFoe').innerHTML='<div class="slot-empty">AI card</div>';

  // result
  const r=$('dResult');
  if(rev){
    r.className='result show '+D.outcome;
    $('dResultTitle').textContent=D.outcome==='win'?'Round won':D.outcome==='lose'?'Round lost':'Draw';
    let copy=outcomeCopy(D.pCard,D.aCard,D.stat);
    if(D.over)copy+=' '+(D.score.p>D.score.a?'That wins the duel.':'That loses the duel.');
    else if(!D.sudden&&D.round>=HAND)copy+=' Scores are level, so sudden death is next: one fresh card each.';
    else copy+=` Next: ${D.attacker==='p'?'the AI attacks':'you attack'}.`;
    $('dResultCopy').textContent=copy;
    $('dNext').textContent=D.over?'See result':'Next round';
    $('dNext').focus({preventScroll:true});
  }else r.className='result';

  // hand
  const hand=$('dHand'),sx=hand.scrollLeft;
  const att=D.phase==='pAttack',def=D.phase==='pDefend'&&D.hands.p.length>1;
  hand.innerHTML=D.hands.p.map((b,i)=>{
    const selected=D.sel&&D.sel.i===i;
    const cls=['card','mini'];if(selected)cls.push('selected');if(def)cls.push('defendable');
    const attrs=def?` role="button" tabindex="0" aria-label="Defend with ${esc(b.make)} ${esc(b.model)}"`:'';
    return `<article class="${cls.join(' ')}" data-i="${i}"${attrs}>${cardHTML(b,{act:att,sel:selected?D.sel.k:null,target:def||(D.phase==='pDefend'&&selected)?D.stat:null})}</article>`;
  }).join('');
  hand.scrollLeft=sx;
  $('handTitle').textContent=D.hands.p.length?'Your hand':'Your hand is empty';

  // confirm bar
  const cf=$('dConfirm');
  if(D.sel&&(att&&D.sel.k||def)){
    const b=D.hands.p[D.sel.i];
    cf.hidden=false;
    $('dConfirmText').textContent=att?`Attack with ${b.make} ${b.model} on ${STAT_META[D.sel.k].name} (${fmt(b.stats[D.sel.k])})?`:`Defend with ${b.make} ${b.model} (${STAT_META[D.stat].name} ${fmt(b.stats[D.stat])})?`;
    $('dGo').textContent=att?'Play card':'Defend';
  }else cf.hidden=true;
}
$('dHand').addEventListener('click',e=>{
  if(!D)return;
  const card=e.target.closest('.card');if(!card)return;
  const i=+card.dataset.i;
  if(D.phase==='pAttack'){
    const s=e.target.closest('.stat');if(!s)return;
    D.sel={i,k:s.dataset.stat};dRender();
  }else if(D.phase==='pDefend'&&D.hands.p.length>1){D.sel={i};dRender()}
});
$('dHand').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&D&&D.phase==='pDefend'&&D.hands.p.length>1){
    const card=e.target.closest('.card');if(card){e.preventDefault();D.sel={i:+card.dataset.i};dRender();$('dGo').focus()}
  }
});
$('dGo').onclick=dConfirm;
$('dCancel').onclick=()=>{if(D){D.sel=null;dRender()}};
$('dNext').onclick=()=>{if(D)dContinue()};

/* ---------- menu + settings ---------- */
function toMenu(){Q=null;D=null;SID++;$('end').hidden=true;show('home')}
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=toMenu);
$('endMenu').onclick=toMenu;
$('rematch').onclick=()=>{$('end').hidden=true;S.mode==='quick'?qStart():dStart()};
$('start').onclick=()=>{save();S.mode==='quick'?qStart():dStart()};

function syncSettings(){
  document.querySelectorAll('#modeOpts .opt').forEach(o=>o.classList.toggle('selected',o.dataset.v===S.mode));
  document.querySelectorAll('#levelOpts .opt').forEach(o=>{o.classList.toggle('selected',o.dataset.v===S.level);o.querySelector('small').textContent=LEVEL_COPY[S.mode][o.dataset.v]});
  document.querySelectorAll('#targetOpts .opt').forEach(o=>o.classList.toggle('selected',+o.dataset.v===S.target));
  $('targetSetting').hidden=S.mode!=='quick';
  $('modeNote').textContent=S.mode==='quick'
    ?`The AI holds a hidden hand. You name a stat on your card, then it plays its best card for that stat. First to ${S.target} round wins takes the match.`
    :'Each side holds five cards, and each card is played once. The attacker picks a card and a stat, then the defender answers with one of theirs. Win three rounds to win the duel. If it ends level, sudden death decides it.';
  $('aiPill').textContent='AI: '+cap(S.level);
}
[['modeOpts','mode'],['levelOpts','level'],['targetOpts','target']].forEach(([id,key])=>{
  $(id).addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;S[key]=key==='target'?+o.dataset.v:o.dataset.v;save();syncSettings()});
});
$('countPill').textContent=BIKES.length+' bikes';
$('lede').textContent=`${BIKES.length} real motorcycle cards. Five balanced game stats. Beat the AI one round at a time.`;
syncSettings();

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
